<script>
  (function () {
    var root = document.documentElement, btn = document.getElementById("theme-btn");
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    function current() { return root.dataset.theme || (mq.matches ? "dark" : "light"); }
    function label() { btn.setAttribute("aria-label", current() === "dark" ? "Switch to light mode" : "Switch to dark mode"); }
    btn.addEventListener("click", function () {
      var next = current() === "dark" ? "light" : "dark";
      root.dataset.theme = next;
      try { localStorage.setItem("theme", next); } catch (e) {}
      label();
    });
    label();
  })();
</script>
